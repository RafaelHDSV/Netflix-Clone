name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI build then squash-merge patch/minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -e
          for i in $(seq 1 60); do
            state=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '[.statusCheckRollup[]? | select(.name == "build")][0].conclusion // "PENDING"')
            echo "CI build: $state (attempt $i)"
            case "$state" in
              SUCCESS)
                gh pr merge --squash "$PR_URL"
                exit 0
                ;;
              FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE)
                echo "CI failed with $state"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for CI build"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
